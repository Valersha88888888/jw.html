
<!DOCTYPE html>
<html lang="sv">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Leads | J&W Quality Hemservice CRM</title>

<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/leads.css">

<link rel="stylesheet" href="css/mobile-nav.css">

</head>

<body>

<div class="app">

<button
    type="button"
    class="crm-mobile-menu-button"
    id="mobileMenuButton"
    aria-label="&Ouml;ppna meny"
    aria-controls="mainSidebar"
    aria-expanded="false">
    <span></span>
    <span></span>
    <span></span>
</button>

<div
    class="crm-mobile-overlay"
    id="mobileMenuOverlay">
</div>
<nav class="sidebar" id="mainSidebar">

<div class="logo">

<h2>J&W CRM</h2>

<p>Quality Hemservice</p>

</div>

<div class="menu">

<a href="dashboard.html">
<span class="crm-menu-icon" aria-hidden="true">&#128202;</span>
<span>Dashboard</span>
</a>

<a href="leads.html" class="active">
<span class="crm-menu-icon" aria-hidden="true">&#128101;</span>
<span>Leads</span>
</a>

<a href="offers.html">
<span class="crm-menu-icon" aria-hidden="true">&#128196;</span>
<span>Offerter</span>
</a>

<a href="customers.html">
<span class="crm-menu-icon" aria-hidden="true">&#128100;</span>
<span>Kunder</span>
</a>

<a href="settings.html">
<span class="crm-menu-icon" aria-hidden="true">&#9881;</span>
<span>Inst&auml;llningar</span>
</a>

</div>

<div class="logout">

<a href="#" id="logout">
<span class="crm-menu-icon" aria-hidden="true">&#128682;</span>
<span>Logga ut</span>
</a>

</div>

</nav>

<main class="main">

<header class="header">

<div>

<h1>Leads</h1>

<p>Hantera alla inkommande kunder</p>

</div>

<div class="user" id="userName">

</div>

</header>

<section class="toolbar">

<div class="search-box">

<input
type="text"
id="searchInput"
class="input"
placeholder="S&ouml;k namn, telefon eller e-post...">

</div>
<select
id="statusFilter"
class="select"
title="Filtrera leads efter status"
aria-label="Statusfilter">

<option value="">Alla status</option>

<option>Ny</option>

<option>Kontaktad</option>

<option>Bokad</option>

<option>Offert skickad</option>

<option>Kund</option>

</select>

<button
class="btn btn-primary"
id="newLeadBtn">

+ Ny Lead

</button>

</section>

<section class="card">

<div class="table-responsive">

<table class="table">

<thead>

<tr>

<th>Namn</th>

<th>Telefon</th>

<th>E-post</th>

<th>Ort</th>

<th>Status</th>

<th>&Aring;tg&auml;rder</th>

</tr>

</thead>

<tbody id="leadTable">

<tr>

<td colspan="6">

Laddar...

</td>

</tr>

</tbody>

</table>

</div>

</section>

<div
class="modal"
id="leadModal">

<div class="modal-content">

<h2 id="modalTitle">

Ny Lead

</h2>

<form id="leadForm">

<div class="grid-2">

<div class="form-group">

<label>Namn</label>

<input
type="text"
id="leadName"
class="input"
required>

</div>

<div class="form-group">

<label>Telefon</label>

<input
type="text"
id="leadPhone"
class="input">

</div>

<div class="form-group">

<label>E-post</label>

<input
type="email"
id="leadEmail"
class="input">

</div>

<div class="form-group">

<label>Ort</label>

<input
type="text"
id="leadArea"
class="input">

</div>

<div class="form-group">

<label for="leadStatus">Status</label>

<select
id="leadStatus"
class="select">

<option>Ny</option>

<option>Kontaktad</option>

<option>Bokad</option>

<option>Offert skickad</option>

<option>Kund</option>

</select>

</div>

<div class="form-group">

<label>Tj&auml;nst</label>

<input
type="text"
id="leadService"
class="input">

</div>

<div class="form-group"
style="grid-column:1/3;">

<label>Anteckningar</label>

<textarea
id="leadNotes"
class="textarea"></textarea>

</div>

<div class="actions">

<button
type="button"
class="btn btn-secondary"
id="cancelLead">

Avbryt

</button>

<button
type="submit"
class="btn btn-success">

Spara Lead

</button>

</div>

</form>

</div>

</div>

<section class="card">

<h2 class="card-title">Snabb&aring;tg&auml;rder</h2>

<div class="toolbar">

<button
class="btn btn-primary"
id="refreshBtn">

&#8635; Uppdatera

</button>

<button
class="btn btn-success"
id="exportBtn">

&#128196; Exportera

</button>

<button
class="btn btn-warning"
id="mailBtn">

&#9993; Skicka Mail

</button>

<button
class="btn btn-secondary"
id="offerBtn">

&#128221; Skapa Offert

</button>

</div>

</section>

<footer class="footer">

<p>

J&W Quality Hemservice CRM

</p>

<p>

Version 1.0

</p>

</footer>

</main>

</div>

<div id="loader">

<div class="spinner"></div>

</div>

<div id="toast"></div>

<script src="js/api.js"></script>

<script src="js/ui.js"></script>

<script src="js/mobile-nav.js"></script>
<script src="js/leads.js"></script>

</body>

</html>
