<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>J&W Admin Login</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f7fc;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
width:400px;
}

h1{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:15px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:10px;
}

button{
width:100%;
padding:15px;
background:#3558d6;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="login-box">

<h1>🔒 J&W CRM Login</h1>

<input
id="username"
placeholder="Användarnamn">

<input
id="password"
type="password"
placeholder="Lösenord">

<button onclick="login()">
Logga in
</button>

</div>

<script>

function login(){

const user =
document.getElementById(
"username"
).value;

const pass =
document.getElementById(
"password"
).value;

if(
user === "admin"
&&
pass === "jw2026"
){

window.location =
"crm.html";

}else{

alert(
"Fel användarnamn eller lösenord"
);

}

}

</script>

</body>
</html>
