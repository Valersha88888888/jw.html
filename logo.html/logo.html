<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>J&W — Quality Hemservice</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --brand-gray:#626a6d;   /* сірий текст */
    --bg:#f7f5f2;

  --brand-pink:#e9b7c7; /* рожевий */
  --white:#fff;
 }

.bubbles{ width:clamp(110px,26vw,200px); display:block; margin:0 auto 24px; }

/* Колір і блиск */
.bubble{ fill:var(--brand-pink); stroke:none; }
.shine { fill:var(--white); opacity:.55; stroke:none; }

/* Дозволяємо рухати кожну бульбашку через CSS */
.bubbles g{
  transform-box: fill-box;           /* важливо для коректного origin */
  transform-origin: center;
}
.b1{ transform: translate(var(--b1-x), var(--b1-y)) scale(var(--b1-scale)); }
.b2{ transform: translate(var(--b2-x), var(--b2-y)) scale(var(--b2-scale)); }
.b3{ transform: translate(var(--b3-x), var(--b3-y)) scale(var(--b3-scale)); }
.b4{ transform: translate(var(--b4-x), var(--b4-y)) scale(var(--b4-scale)); }

  html,body{height:100%}
  body{
    margin:0; background:var(--bg);
    display:grid; place-items:center; padding:40px 16px;
  }

  .logo{ text-align:center; color:var(--brand-gray); }

  /* БУЛЬБАШКИ */
  .bubbles {
  width: clamp(150px, 26vw, 200px);
  display:block;
  margin: 80px auto 1px; /* ⬅️ збільш верхній відступ, зменш нижній */
}

  

  .bubble{ fill: var(--brand-pink); stroke: none; }
  .shine{  fill: var(--white); opacity:.55; stroke: none; }

  /* СЛОВО-БРЕНД */
  .brand{
    font-family:"Playfair Display", serif;
    font-weight:800;
    letter-spacing:.02em;
    font-size:clamp(48px, 7.2vw, 92px);
    line-height:1;
    margin:8px 0 2px;
    color:var(--brand-gray);
  }

  /* ТЕГЛАЙН */
  .tag{
    font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    font-weight:800;
    letter-spacing:.20em;
    text-transform:uppercase;
    color:var(--brand-gray);
    font-size:clamp(12px, 1.6vw, 20px);
    margin-top:8px;
  }
</style>
</head>
<body>

  <div class="logo" aria-label="J&W  Quality — logotyp med bubblor">
    <!-- БУЛЬБАШКИ НА ПЕРЕХРЕСТ -->
    <svg class="bubbles" viewBox="0 0 260 180" role="img" aria-hidden="true">
      <!-- велика права -->
      <circle cx="170" cy="90" r="40" class="bubble"/>
      <path d="M190 75a15 15 0 0 1-22 18" class="shine"/>

      <!-- велика ліва -->
      <circle cx="100" cy="110" r="35" class="bubble"/>
      <path d="M115 98a10 10 0 0 1-15 12" class="shine"/>

      <!-- маленька верхня -->
      <circle cx="120" cy="45" r="18" class="bubble"/>
      <path d="M127 39a6 6 0 0 1-8 6" class="shine"/>

      <!-- маленька нижня -->
      <circle cx="65" cy="150" r="14" class="bubble"/>
      <path d="M70 145a4 4 0 0 1-5 5" class="shine"/>


    </svg>

    <!-- БРЕНД ТА ТЕГЛАЙН -->
    <div class="brand">J&amp;W</div>
    <div class="tag"> Quality HEMSERVICE </div>
  </div>

</body>
</html>
