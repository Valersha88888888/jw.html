<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>J&W CRM Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f4f7fc;
padding:30px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.logo{
font-size:32px;
font-weight:800;
color:#3558d6;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card h2{
font-size:36px;
color:#3558d6;
margin-bottom:10px;
}

.card p{
color:#666;
}

.search-box{
margin-bottom:20px;
}

.search-box input{
width:100%;
padding:15px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

th{
background:#3558d6;
color:white;
padding:15px;
text-align:left;
}

td{
padding:15px;
border-bottom:1px solid #eee;
}

tr:hover{
background:#f8fafc;
cursor:pointer;
}

.status{
padding:8px 12px;
border-radius:20px;
font-size:14px;
border:none;
}

.details{
display:none;
margin-top:30px;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.action-btn{
display:inline-block;
padding:10px 15px;
border-radius:8px;
text-decoration:none;
color:white;
margin-right:10px;
margin-top:10px;
}

.call{
background:#16a34a;
}

.mail{
background:#3558d6;
}

textarea{
width:100%;
height:120px;
margin-top:15px;
padding:15px;
border-radius:10px;
border:1px solid #ddd;
}

</style>
</head>

<body>
<div class="topbar">

<div class="logo">
🏠 J&W CRM
</div>

<div class="menu">

<button class="menu-btn">
📊 Dashboard
</button>

<button class="menu-btn">
📋 Leads
</button>

<button class="menu-btn">
📧 Email
</button>

<button class="menu-btn">
⚙️ Inställningar
</button>

</div>

</div>

<div class="header">

<div class="logo">
📊 J&W CRM Dashboard
</div>

</div>

<div class="stats">

<div class="card">
<h2 id="totalLeads">0</h2>
<p>Totala Leads</p>
</div>

<div class="card">
<h2 id="newLeads">0</h2>
<p>Nya Leads</p>
</div>

<div class="card">
<h2 id="contactedLeads">0</h2>
<p>Kontaktade</p>
</div>

<div class="card">
<h2 id="customers">0</h2>
<p>Kunder</p>
</div>

</div>

<div class="search-box">

<input
id="searchInput"
type="text"
placeholder="Sök namn, telefon eller e-post">

</div>
<div class="actions">

<button>
➕ Ny Lead
</button>

<button>
📤 Export Excel
</button>

<button>
🔄 Uppdatera
</button>

</div>

<table>

<thead>

<tr>
<th>Namn</th>
<th>Telefon</th>
<th>E-post</th>
<th>Tjänst</th>
<th>Område</th>
<th>Status</th>
<th>Datum</th>
</tr>

</thead>

<tbody id="leadTable">
</tbody>

</table>

<div id="leadDetails" class="details">

<h2>Kundinformation</h2>

<div id="detailsContent"></div>

</div>

<script>

let allLeads = [];

async function loadLeads(){

const response =
await fetch(
"http://localhost:3000/api/leads"
);

const leads =
await response.json();

allLeads = leads;

document.getElementById(
"totalLeads"
).innerText = leads.length;

const newLeads =
leads.filter(
lead => !lead.status || lead.status === "ny"
).length;

const contactedLeads =
leads.filter(
lead => lead.status === "kontaktad"
).length;

const customers =
leads.filter(
lead => lead.status === "kund"
).length;

document.getElementById(
"newLeads"
).innerText = newLeads;

document.getElementById(
"contactedLeads"
).innerText = contactedLeads;

document.getElementById(
"customers"
).innerText = customers;

const search =
document.getElementById(
"searchInput"
).value.toLowerCase();

const filtered =
leads.filter(lead =>

(lead.name || "")
.toLowerCase()
.includes(search)

||

(lead.phone || "")
.toLowerCase()
.includes(search)

||

(lead.email || "")
.toLowerCase()
.includes(search)

);

const table =
document.getElementById(
"leadTable"
);

table.innerHTML = "";

[...filtered]
.reverse()
.forEach((lead,index)=>{

table.innerHTML += `
<tr onclick="showLead(${leads.length-1-index})">

<td>${lead.name || ""}</td>

<td>${lead.phone || ""}</td>

<td>${lead.email || ""}</td>

<td>${lead.serviceType || ""}</td>

<td>${lead.area || ""}</td>

<td>

<select
class="status"
onchange="updateStatus(${lead.id}, this.value)"
>

<option value="ny"
${lead.status==="ny" ? "selected" : ""}>
🟡 Ny
</option>

<option value="kontaktad"
${lead.status==="kontaktad" ? "selected" : ""}>
🔵 Kontaktad
</option>

<option value="offert"
${lead.status==="offert" ? "selected" : ""}>
🟠 Offert skickad
</option>

<option value="kund"
${lead.status==="kund" ? "selected" : ""}>
🟢 Kund
</option>

<option value="avslutad"
${lead.status==="avslutad" ? "selected" : ""}>
⚫ Avslutad
</option>

</select>

</td>
<td>
${lead.createdAt
? new Date(
lead.createdAt
).toLocaleDateString("sv-SE")
: ""
}
</td>

</tr>
`;

});

}

function showLead(index){

const lead = allLeads[index];

if(!lead){
return;
}

document.getElementById(
"leadDetails"
).style.display = "block";

document.getElementById(
"detailsContent"
).innerHTML = `

<p><b>Namn:</b> ${lead.name || ""}</p>

<p><b>Telefon:</b> ${lead.phone || ""}</p>

<p><b>E-post:</b> ${lead.email || ""}</p>

<p><b>Tjänst:</b> ${lead.serviceType || ""}</p>

<p><b>Rum:</b> ${lead.size || ""}</p>

<p><b>Storlek:</b> ${lead.squareMeters || ""} m²</p>

<p><b>Område:</b> ${lead.area || ""}</p>

<p><b>Datum:</b>
${lead.createdAt
? new Date(lead.createdAt).toLocaleString("sv-SE")
: ""}
</p>

<hr>

<h3>Lead Information</h3>

<p><b>Status:</b> ${lead.status || "ny"}</p>

<p><b>Källa:</b> Webbformulär</p>

<a
class="action-btn call"
href="tel:${lead.phone}">
📞 Ring kund
</a>

<a
class="action-btn mail"
href="mailto:${lead.email}">
✉️ Skicka email
</a>

<button
class="action-btn"
style="background:#f59e0b;"
onclick="sendOffer('${lead.email}','${lead.name}')">
📄 Skicka Offert
</button>

<button
class="action-btn"
style="background:#dc2626;"
onclick="deleteLead(${lead.id})">
🗑️ Ta bort Lead
</button>

<h3 style="margin-top:20px;">
Anteckningar
</h3>

<textarea
placeholder="Skriv anteckningar här...">
</textarea>

`;

}
async function deleteLead(id){

const confirmDelete = confirm(
"Vill du verkligen ta bort denna lead?"
);

if(!confirmDelete){
return;
}

try{

await fetch(
`http://localhost:3000/api/leads/${id}`,
{
method:"DELETE"
}
);

document.getElementById(
"leadDetails"
).style.display = "none";

await loadLeads();

}catch(err){

console.error(
"Delete failed:",
err
);

}

}
function generateOfferNumber(){

const now = new Date();

const year = now.getFullYear();

const number =
Math.floor(Math.random() * 9000) + 1000;

return `JW-${year}-${number}`;

}

async function sendOffer(email,name){

const offerNumber =
generateOfferNumber();

try{

await fetch(
"http://localhost:3000/api/send-email",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

to: email,

subject:
`Offert ${offerNumber} - J&W Quality Hemservice`,

message:

`Hej ${name},

Tack för att du kontaktat J&W Quality Hemservice.

Offertnummer:
${offerNumber}

Vi uppskattar att du valt att vända dig till oss och arbetar nu med att ta fram en offert anpassad efter dina behov och önskemål.

Vårt mål är att erbjuda professionell service, hög kvalitet och ett resultat som överträffar dina förväntningar.

Vi återkommer inom kort med en komplett offert.

Har du frågor är du alltid välkommen att kontakta oss.

Tack för förtroendet.

Med vänliga hälsningar

J&W Quality Hemservice

📞 +46 76 909 02 40

📧 jw.qualityhemservice@gmail.com`

})
}
);

alert("Offert skickad!");

}catch(err){

console.error(
"Offer send failed:",
err
);

alert(
"Fel vid utskick av offert"
);

}

}

async function updateStatus(id,status){

try{

await fetch(
`http://localhost:3000/api/leads/${id}`,
{
method:"PUT",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
status:status
})
}
);

await loadLeads();

}catch(err){

console.error(
"Status update failed:",
err
);

}

}

document
.getElementById(
"searchInput"
)
.addEventListener(
"input",
loadLeads
);

loadLeads();


</script>

</body>
</html>
